name: Native validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'build-tools;35.0.0'
      - run: ./gradlew :core:test :app:assembleDebug :app:lintDebug :app:bundleRelease
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: kotlin-fixture
          path: shared/fixtures/generated/kotlin.drawry
          if-no-files-found: error
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: android
          script: ./gradlew :app:connectedDebugAndroidTest
  ios-and-interop:
    runs-on: macos-15
    needs: android
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - uses: actions/download-artifact@v4
        with:
          name: kotlin-fixture
          path: shared/fixtures/generated
      - run: swift test
        working-directory: ios
        env:
          DRAWRY_KOTLIN_BACKUP: ${{ github.workspace }}/shared/fixtures/generated/kotlin.drawry
      - run: swift run CoreCheck ../shared/fixtures/generated
        working-directory: ios
      - run: xcodebuild -project ios/Drawry.xcodeproj -scheme Drawry -destination 'platform=iOS Simulator,name=iPhone 17' CODE_SIGNING_ALLOWED=NO test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: ./gradlew :core:test --rerun-tasks
        working-directory: android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interoperability-results
          path: |
            shared/fixtures/generated/
            android/core/build/test-results/
