name: Drawry
options:
  developmentLanguage: ko
  bundleIdPrefix: com.poyal
  deploymentTarget:
    iOS: '17.0'
packages:
  DrawryCore:
    path: .
  SQLCipher:
    url: https://github.com/sqlcipher/SQLCipher.swift.git
    exactVersion: 4.14.0
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '2.0.0'
    CURRENT_PROJECT_VERSION: '2'
    GCC_PREPROCESSOR_DEFINITIONS: ['$(inherited)', 'SQLITE_HAS_CODEC=1']
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Drawry:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Runner/Assets.xcassets
      - path: ../shared/licenses
        buildPhase: resources
      - path: ../shared/fonts
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Drawry
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: 일기에 남길 사진과 영상을 촬영합니다.
        NSMicrophoneUsageDescription: 일기에 남길 영상의 소리를 녹음합니다.
        NSFaceIDUsageDescription: 나만의 일기 잠금을 해제합니다.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: true
        LSSupportsOpeningDocumentsInPlace: true
        UIAppFonts: [NanumPenScript-Regular.ttf]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.poyal.drawry
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: DrawryCore
      - package: SQLCipher
  DrawryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: UITests
    dependencies:
      - target: Drawry
schemes:
  Drawry:
    build:
      targets:
        Drawry: all
    test:
      targets: [DrawryUITests]
