name: drawry
description: "사진과 영상을 암호화해 보관하는 비공개 그림일기 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  archive: ^4.0.7
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  cupertino_icons: ^1.0.8
  drift: 2.34.0
  file_selector: ^1.1.0
  get_video_thumbnail: 0.8.0
  flutter_riverpod: 3.0.3
  flutter_secure_storage: 10.3.1
  image: ^4.6.0
  image_picker: ^1.2.3
  intl: ^0.20.2
  local_auth: ^3.0.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pro_image_editor: ^13.3.1
  share_plus: ^13.3.0
  sqlite3: ^3.5.2
  uuid: ^4.5.2
  video_player: ^2.14.0

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: 2.34.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: 2.1.3

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  generate: true
  uses-material-design: true
  config:
    enable-swift-package-manager: true
